# =============================================================================
# Nginx del frontend - Sistema de Gestion de Inventarios INICTEL-UNI
#
# Sirve la aplicacion Angular compilada y reenvia /api al backend. Al quedar los
# dos detras del mismo origen, connect-src 'self' basta y no hace falta abrir
# CORS a nadie (RNF-07, RNF-10).
#
# Las cabeceras de endurecimiento se declaran aqui ademas de en Spring: Spring
# solo las pone en lo que el sirve —la API—, y quien entrega el HTML y el
# JavaScript de la aplicacion es este nginx. Viven en seguridad-cabeceras.conf
# y se incluyen en CADA location, porque nginx no las hereda alli donde el
# location declara cabeceras propias.
# =============================================================================

server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/seguridad-cabeceras.conf;

    # ------------------------------------------------------ Compresion (RNF-18)
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    client_max_body_size 6m;   # RF-51e: 5 MB de fotografia, con holgura

    # ------------------------------------------------------------------ La API
    # Este location no anade cabeceras propias, de modo que hereda las del
    # bloque server. Aun asi el backend pone las suyas en cada respuesta.
    #
    # proxy_pass apunta al backend. Es el unico valor que cambia al desplegar:
    #
    #   http://backend:8080         servicio 'backend' de la misma red Docker
    #   http://10.0.0.7:8080        servidor propio de la institucion
    #   https://inventario-api.onrender.com   backend ya publicado (ver abajo)
    #
    # Mientras la API se sirva por aqui, frontend y backend son el mismo origen
    # para el navegador: no hay CORS que configurar y connect-src 'self' basta.
    #
    # Si el destino es HTTPS hay que anadir ademas estas tres lineas, porque
    # nginx no manda SNI ni corrige la cabecera Host por su cuenta:
    #
    #   proxy_ssl_server_name on;
    #   proxy_set_header Host inventario-api.onrender.com;
    #   resolver 8.8.8.8 1.1.1.1 valid=300s;
    #
    location /api/ {
        proxy_pass         http://backend-inventario:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Los recursos llevan huella en el nombre y no cambian nunca: se cachean un
    # ano. Al declarar Cache-Control hay que reponer las de seguridad.
    location ~* \.(?:js|css|woff2|png|jpg|jpeg|svg|ico)$ {
        include /etc/nginx/seguridad-cabeceras.conf;
        # Sin 'expires': esa directiva emite su propio Cache-Control y la
        # respuesta salia con la cabecera dos veces, una con max-age y otra con
        # immutable. Se declara una sola, completa.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # -------------------------------------------------- Rutas de la aplicacion
    # Angular resuelve sus rutas en el cliente, asi que cualquier direccion que
    # no sea un archivo devuelve el index y deja decidir al enrutador: es lo que
    # hace que /inventario/12 funcione al recargar y que una ruta inventada
    # llegue a la pagina 404 propia (RNF-34).
    location / {
        include /etc/nginx/seguridad-cabeceras.conf;
        try_files $uri $uri/ /index.html;
        # El index no se cachea: es quien nombra los recursos con huella, y uno
        # viejo apuntaria a ficheros que ya no existen.
        add_header Cache-Control "no-cache" always;
    }
}
