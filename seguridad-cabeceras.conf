# =============================================================================
# Cabeceras de endurecimiento del navegador (RNF-07, RNF-09).
#
# Vive en su propio fichero porque nginx NO hereda las cabeceras del bloque
# padre en un location que declara las suyas: basta un 'add_header Cache-Control'
# dentro de un location para que ese location se quede sin Content-Security-
# Policy y sin todas las demas. Por eso se incluye explicitamente en cada uno.
#
# La politica es la misma cadena que CSP_ESTRICTA en SeguridadConfig.java: sin
# 'unsafe-inline' y sin 'unsafe-eval' en ninguna directiva. Si una cambia, la
# otra tiene que cambiar con ella.
# =============================================================================

add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; media-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;

# RNF-09b: la camara, solo para el propio origen, porque el registro de un bien
# la usa para fotografiarlo desde la tablet (RF-51b). El resto, denegado.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# HSTS solo tiene sentido tras el terminador TLS. Si este nginx queda detras de
# otro proxy que ya la emite, comentar esta linea para no duplicarla.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
