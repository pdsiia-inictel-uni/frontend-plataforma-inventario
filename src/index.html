<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Inventario | INICTEL-UNI</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sistema de Gestion de Inventarios de INICTEL-UNI">

  <!--
    Content-Security-Policy estricta (RNF-07).

    En produccion la cabecera equivalente la emite el nginx del frontend
    (seguridad-cabeceras.conf, donde cada directiva esta explicada); esta
    etiqueta protege ademas el servidor de desarrollo de Angular. Parte de
    negarlo todo (default-src 'none') y autoriza solo lo que la aplicacion usa,
    sin 'unsafe-inline' ni 'unsafe-eval'. Una prueba automatica falla si
    reaparecen manejadores, scripts embebidos o estilos en linea (csp.spec.ts).

    - img-src blob:   las fotografias se descargan con JWT y se muestran como blob.
    - frame-src blob: la vista previa de los PDF (baja y formato de uso).
    - connect-src     solo el propio origen, y basta: en desarrollo /api va por el
                      proxy de Angular (proxy.conf.json) y en produccion lo
                      reenvia nginx, de modo que no hay peticion cruzada (RNF-44b).
    - La camara no necesita media-src: su flujo va por srcObject, que no pasa
      por la CSP.

    frame-ancestors no aparece aqui a proposito: el navegador lo ignora cuando
    llega por <meta>. Viaja en la cabecera de nginx, junto con X-Frame-Options
    DENY (RNF-09).
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="same-origin">

  <!--
    Icono del navegador.

    Se sirve desde la raiz y con rutas absolutas: una ruta relativa se resuelve
    contra la direccion en curso, de modo que en /inventario/nuevo el navegador
    la iba a buscar donde no estaba y la pestana se quedaba con el icono
    generico.

    Los archivos se generan a partir del logotipo institucional recortado a su
    simbolo: la palabra "INICTEL-UNI" del logotipo completo es un borron
    ilegible a 16 px. El simbolo va sobre un cuadrado blanco porque es azul
    sobre fondo transparente y se perdia en las pestanas de tema oscuro.

    favicon.ico lleva dentro los tres tamanos que pide el escritorio (16, 32 y
    48); ademas se declara para que el navegador no tenga que adivinar.
  -->
  <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="icon" type="image/png" href="/icono-512.png" sizes="512x512">
  <link rel="apple-touch-icon" href="/icono-180.png">
</head>
<body>
  <app-root></app-root>
</body>
</html>
