# =============================================================================
# Cabeceras de endurecimiento comunes a TODAS las respuestas (RNF-09).
#
# No se incluye sola: la incluyen seguridad-cabeceras.conf (aplicacion) y
# seguridad-cabeceras-api.conf (API), que anaden cada una su propia
# Content-Security-Policy. Asi estas cinco lineas viven en un solo sitio.
# =============================================================================

# El navegador no puede meter la aplicacion en un marco ajeno (clickjacking).
# Es el equivalente antiguo de frame-ancestors 'none', para navegadores que no
# lo entienden.
add_header X-Frame-Options "DENY" always;

# El navegador respeta el Content-Type declarado y no "adivina": un PDF o una
# imagen nunca se interpretan como script.
add_header X-Content-Type-Options "nosniff" always;

# Al salir hacia otro sitio no se envia la URL de origen: las rutas llevan ids
# de bienes y de personas.
add_header Referrer-Policy "same-origin" always;

# RNF-09b: la camara, solo para el propio origen, porque el registro de un bien
# la usa para fotografiarlo desde la tablet (RF-51b). El resto, denegado.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# HSTS: el navegador no vuelve a intentar HTTP en un ano. Solo tiene efecto
# cuando la respuesta llega por HTTPS. Si este nginx queda detras de otro proxy
# que ya la emite, comentar esta linea para no duplicarla.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
