# =============================================================================
# Nginx del frontend - Sistema de Gestion de Inventarios INICTEL-UNI
#
# Sirve la aplicacion Angular compilada y reenvia /api al backend. Al quedar los
# dos detras del mismo origen, connect-src 'self' basta y no hace falta abrir
# CORS a nadie (RNF-07, RNF-10).
#
# Corre como usuario sin privilegios (imagen nginx-unprivileged), que no puede
# abrir puertos por debajo de 1024: escucha en 8080 (HTTP) y 8443 (HTTPS), y
# docker-compose los publica como 80 y 443.
#
# Las cabeceras de endurecimiento viven en seguridad-cabeceras.conf (la
# aplicacion) y seguridad-cabeceras-api.conf (la API), y se incluyen en CADA
# location, porque nginx no las hereda alli donde el location declara cabeceras
# propias (RNF-44c).
# =============================================================================

# No anunciar la version de nginx en cabeceras ni en paginas de error.
server_tokens off;

# ------------------------------------------------------------------- HTTP (80)
server {
    listen 8080;
    server_name inventariodidt.inictel-uni.edu.pe;

    # Sonda de estado del contenedor. Va por HTTP y no redirige: el
    # HEALTHCHECK de la imagen solo necesita saber que nginx responde, y
    # seguir la redireccion le obligaria a validar el certificado.
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Todo lo demas, a HTTPS (RNF-01).
    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------- HTTPS (443)
server {
    listen 8443 ssl;
    http2 on;
    server_name inventariodidt.inictel-uni.edu.pe;

    # El certificado y su clave se montan desde el servidor (docker-compose,
    # carpeta certificados/). Nunca se copian dentro de la imagen.
    ssl_certificate     /etc/nginx/ssl/inventario.crt;
    ssl_certificate_key /etc/nginx/ssl/inventario.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/seguridad-cabeceras.conf;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    # 12 MB, igual que spring.servlet.multipart.max-request-size: el PDF de una
    # baja admite 10 MB (RF-42) y con 6 MB nginx lo rechazaba con un 413 antes
    # de que llegara al backend.
    client_max_body_size 12m;
    client_body_buffer_size 6m;

    location ^~ /api/ {
        # Una sola copia de cada cabecera de seguridad: se retiran las que pone
        # Spring y se ponen las de la API (misma politica que CSP_API).
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
        include /etc/nginx/seguridad-cabeceras-api.conf;

        # 'backend-inventario' es el nombre del servicio en docker-compose.yml.
        proxy_pass         http://backend-inventario:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Archivos con huella en el nombre (main-XXXX.js): se guardan un ano.
    location ~* \.(?:js|css|woff2|png|jpg|jpeg|svg|ico)$ {
        include /etc/nginx/seguridad-cabeceras.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html y las rutas de la aplicacion: siempre se revalidan, para que
    # un despliegue nuevo llegue en la siguiente carga.
    location / {
        include /etc/nginx/seguridad-cabeceras.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
