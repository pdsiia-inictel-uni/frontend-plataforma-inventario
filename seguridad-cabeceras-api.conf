# =============================================================================
# Cabeceras de la API (/api/): respuestas JSON, fotografias y PDF de baja.
#
# Ninguna de esas respuestas es una pagina: el frontend las pide con fetch y,
# si son archivos, las muestra como blob desde su propio origen, bajo la CSP de
# la aplicacion. Por eso la API lleva la politica mas cerrada posible: nada se
# carga, se incrusta ni se envia desde una respuesta suya.
#
# Es la misma politica que CSP_API en SeguridadConfig.java. El location /api/
# oculta las cabeceras que envia Spring (proxy_hide_header) y pone estas, de
# modo que cada respuesta lleva una sola CSP y una sola copia de cada cabecera.
# =============================================================================

include /etc/nginx/seguridad-comunes.conf;

add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
