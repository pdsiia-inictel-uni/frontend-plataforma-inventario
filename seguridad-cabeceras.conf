# =============================================================================
# Cabeceras de la APLICACION: el HTML, el JavaScript, los estilos, las fuentes
# y las imagenes que sirve este nginx (RNF-07, RNF-09).
#
# Se incluye en el bloque server y en CADA location que declara cabeceras
# propias: nginx no hereda las add_header del bloque padre en un location que
# declara las suyas, y un simple 'add_header Cache-Control' dejaria a ese
# location sin CSP.
#
# La API (/api/) no usa este archivo sino seguridad-cabeceras-api.conf.
# =============================================================================

include /etc/nginx/seguridad-comunes.conf;

# Content-Security-Policy de la aplicacion. Se parte de negarlo todo
# (default-src 'none') y se autoriza solo lo que la aplicacion usa de verdad,
# comprobado en un navegador (ver ERS, RNF-07). Sin 'unsafe-inline' ni
# 'unsafe-eval' en ninguna directiva. La etiqueta meta de src/index.html
# declara la misma politica, menos frame-ancestors, que en una meta no surte
# efecto.
#
#   script-src 'self'        el bundle de Angular (main-*.js), del propio origen
#   script-src-attr 'none'   ningun manejador en atributos (onclick=...)
#   style-src 'self'         la hoja styles-*.css
#   style-src-attr 'none'    ningun atributo style=""
#   img-src 'self' blob:     iconos, logotipo y fondo; blob: para las
#                            fotografias, que se descargan con JWT
#   font-src 'self'          Inter, servida desde /fonts
#   connect-src 'self'       /api, reenviado por este mismo nginx: no hay
#                            peticion cruzada ni CORS que abrir (RNF-44b)
#   frame-src blob:          vista previa de los PDF (baja y formato de uso)
#   object-src 'none'        ningun plugin embebido
#   base-uri 'self'          nadie puede cambiar la base de las rutas
#   form-action 'self'       ningun formulario envia fuera del origen
#   frame-ancestors 'none'   la aplicacion no se muestra dentro de otro sitio
#
# La camara no necesita media-src: su flujo se asigna por codigo a srcObject,
# que no es una descarga y no pasa por la CSP. No hay Workers ni manifest, asi
# que worker-src y manifest-src quedan en el 'none' de default-src.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self'; style-src-attr 'none'; img-src 'self' blob:; font-src 'self'; connect-src 'self'; frame-src blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
