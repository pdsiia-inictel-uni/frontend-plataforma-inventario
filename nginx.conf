# =============================================================================
# Nginx del frontend - Sistema de Gestion de Inventarios INICTEL-UNI
#
# Sirve la aplicacion Angular compilada y reenvia /api al backend. Al quedar los
# dos detras del mismo origen, connect-src 'self' basta y no hace falta abrir
# CORS a nadie (RNF-07, RNF-10).
#
# Las cabeceras de endurecimiento se declaran aqui ademas de en Spring: Spring
# solo las pone en lo que el sirve —la API—, y quien entrega el HTML y el
# JavaScript de la aplicacion es este nginx. Viven en seguridad-cabeceras.conf
# y se incluyen en CADA location, porque nginx no las hereda alli donde el
# location declara cabeceras propias.
# =============================================================================

server {
    listen 80;
    server_name inventariodidt.inictel-uni.edu.pe;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name inventariodidt.inictel-uni.edu.pe;

    ssl_certificate     /etc/nginx/ssl/inventario.crt;
    ssl_certificate_key /etc/nginx/ssl/inventario.key;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/seguridad-cabeceras.conf;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/manifest+json;

    client_max_body_size 6m;
    client_body_buffer_size 6m;

    location ^~ /api/ {
        proxy_pass         http://backend-inventario:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ~* \.(?:js|css|woff2|png|jpg|jpeg|svg|ico)$ {
        include /etc/nginx/seguridad-cabeceras.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/seguridad-cabeceras.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
